<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Raspberry</title>
    <link rel="stylesheet" href="client.css">
</head>

<body>
<div class="grid-container">
    <div style="color: #141413" class="card square">
        <div class="title">TWS</div>
        <div class="data" id="tws">--.-</div>
        <div class="title">knt</div>
    </div>

    <div style="color: #141413" class="card square">
        <div class="title">TWA</div>
        <div class="data" style="font-size: 2em" id="twa">--</div>
        <div class="title">degrees</div>
    </div>

    <div style="color: #141413" class="card square">
        <div class="title">SOG</div>
        <div class="data" style="font-size: 2em" id="sog">--.-</div>
        <div class="title">knt</div>
    </div>

    <div style="color: #141413" class="card square">
        <div class="title">VMG</div>
        <div class="data" style="font-size: 2em" id="vmg">--.-</div>
        <div class="title">knt</div>
    </div>

    <div class="dynamic-container">
        <div style="color: #141413; position: relative; overflow: hidden" class="card">
            <img src="horizon.png" style="z-index: 0" class="pitch_line">
            <div class="title">Pitch</div>
            <div class="data" style="font-size: 1.5em; z-index: 1000" id="pitch">--.-</div>
            <div class="title">degrees</div>
        </div>

        <div style="color: #141413; position: relative; overflow: hidden" class="card">
            <img src="horizon.png" style="z-index: 0" class="roll_line">
            <div class="title">Roll</div>
            <div class="data" style="font-size: 1.5em; z-index: 1000" id="roll">--.-</div>
            <div class="title">degrees</div>
        </div>
    </div>
</div>
<div  style="justify-content: right; position: absolute"><p style="margin-top: -1.3em; margin-left: 20px" id="status"></p></div>

<!-- Importation de la librairie client Socket.io (servie automatiquement par le serveur) -->
<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>

</html>
